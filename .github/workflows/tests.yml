name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # rules/ is pure Python; tests/integration stubs the pipeline, so heavy
      # deps (torch, chromadb, ollama) are never imported
      - run: pip install pytest fastapi httpx
      - run: python -m pytest rules tests/integration -q
